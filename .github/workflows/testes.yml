name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar o uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.12"

      - name: Instalar as dependências
        run: uv sync --frozen

      - name: Rodar a suíte
        run: uv run pytest -q

      - name: Conferir o lint
        run: uv run ruff check .

      - name: Conferir a formatação
        run: uv run ruff format --check .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar o Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Rodar os testes do banco isolado
        run: deno test --config tests/web/deno.json --allow-read --allow-env tests/web/

      - name: Rodar os testes da telegram-webhook
        working-directory: supabase/functions/telegram-webhook
        run: deno test

      - name: Rodar os testes da ir
        working-directory: supabase/functions/ir
        run: deno test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar as dependências
        run: npm --prefix web ci

      - name: Conferir o lint e os comentários
        run: npm --prefix web run lint

      - name: Rodar os testes
        run: npm --prefix web run test:run

      - name: Gerar e conferir o artefato publicado
        run: bash scripts/build-web.sh && node web/scripts/check-web-artifact.mjs web/dist

      - name: Instalar o Chromium do Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes no navegador
        working-directory: web
        run: npm run test:e2e

      - name: Guardar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relatorio-do-playwright
          path: web/playwright-report
          retention-days: 7
