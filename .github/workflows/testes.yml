name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar o uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"

      - name: Instalar as dependências
        run: uv sync --frozen

      - name: Rodar a suíte
        run: uv run pytest -q

      - name: Conferir o lint
        run: uv run ruff check .

      - name: Conferir a formatação
        run: uv run ruff format --check .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar o Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Rodar os testes do cadastro e do banco isolado
        run: deno test --config tests/web/deno.json --allow-read --allow-env tests/web/

      - name: Rodar os testes da telegram-webhook
        working-directory: supabase/functions/telegram-webhook
        run: deno test

      - name: Rodar os testes da ir
        working-directory: supabase/functions/ir
        run: deno test
